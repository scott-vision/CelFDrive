name: celfdrive-windows-cpu
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Keep the native stack on Conda Forge; see environment-gpu-windows.yml.
  - python=3.11
  - pip
  - pytorch-cpu
  - torchvision
  - torchaudio
  - ultralytics
  - opencv
  - numpy
  - scipy
  - pandas
  - h5py
  - matplotlib
  - scikit-image
  - pillow
  - seaborn
  - tqdm
  - pyyaml
  - pytest
  - dill=0.3.8
  - networkx=3.2.1
  - tifffile=2024.2.12
  - imageio=2.34.0
  - fsspec=2024.2.0
  - openpyxl
  - pyarrow
  - jupyter
  # Dependencies needed by the pip-only SAHI package.
  - click
  - fire
  - requests
  - shapely
  - terminaltables
  - pip:
      - --no-deps
      - sahi
