# Version policy: libraries whose behaviour the detector depends on carry an
# upper bound at the next major release so that a future solve cannot silently
# cross a breaking version. The exact `==` pins below were added to resolve
# specific solver or runtime conflicts and should not be relaxed without
# re-running tools/verify_slidebook_runtime.py. For byte-exact reproduction of
# a working machine, export a lock file with tools/export_environment_lock.ps1.
name: celfdrive-windows-cpu
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Keep the native stack on Conda Forge; see environment-gpu-windows.yml.
  - python=3.11
  - pip
  - pytorch-cpu<3
  - torchvision<1
  - torchaudio<3
  - ultralytics<9
  - opencv<5
  - numpy<3
  - scipy<2
  - pandas<3
  - h5py
  - matplotlib<4
  - scikit-image<1
  - pillow
  - seaborn
  - tqdm
  - pyyaml<7
  - pytest
  - dill=0.3.8
  - networkx=3.2.1
  - tifffile=2024.2.12
  - imageio=2.34.0
  - fsspec=2024.2.0
  - openpyxl
  - pyarrow
  - jupyter
  # Dependencies needed by the pip-only SAHI package.
  - click
  - fire
  - requests
  - shapely
  - terminaltables
