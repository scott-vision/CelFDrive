# Version policy: libraries whose behaviour the detector depends on carry an
# upper bound at the next major release so that a future solve cannot silently
# cross a breaking version. The exact `==` pins below were added to resolve
# specific solver or runtime conflicts and should not be relaxed without
# re-running tools/verify_slidebook_runtime.py. For byte-exact reproduction of
# a working machine, export a lock file with tools/export_environment_lock.ps1.
name: celfdrive-windows
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Keep the native stack on Conda Forge. In particular, do not install pip
  # torch or opencv into this environment: that can load a second OpenMP DLL in
  # SlideBook's persistent Python process.
  - python=3.11
  - pip
  # CUDA 12.8 is supported by current Windows NVIDIA production drivers. Do
  # not let the solver select CUDA 13 unless the acquisition driver is updated.
  - cuda-version=12.8
  - pytorch-gpu<3
  - torchvision<1
  - torchaudio<3
  - ultralytics<9
  - opencv<5
  - numpy<3
  - scipy<2
  - pandas<3
  - h5py
  - matplotlib<4
  # 0.26.0 includes pip-vendored bytecode that conflicts with pip on Windows.
  - scikit-image<0.26
  - pillow
  - seaborn
  - tqdm
  - pyyaml<7
  - pytest
  - dill=0.3.8
  - networkx=3.2.1
  - tifffile=2024.2.12
  - imageio=2.34.0
  - fsspec=2024.2.0
  - openpyxl
  - pyarrow
  - jupyter
  # Dependencies needed by the pip-only SAHI package.
  - click
  - fire
  - requests
  - shapely
  - terminaltables
