name: celfdrive-windows
dependencies:
  - python=3.11
  - pip
  - pip:
      # Keep native scientific packages on one (pip) distribution.  Mixing
      # conda-forge's LLVM OpenMP runtime (libomp.dll) with pip PyTorch's Intel
      # runtime (libiomp5md.dll) aborts the in-process Python used by SlideBook.
      - numpy
      - scipy
      - pandas
      - h5py
      - matplotlib
      - scikit-image
      - pillow
      - seaborn
      - tqdm
      - pyyaml
      - pytest
      # Install a CUDA-enabled PyTorch build separately when required; see README.
      - torch
      - torchvision
      - torchaudio
      - dill==0.3.8
      # Ultralytics requires opencv-python. Do not install opencv-contrib-python
      # alongside it: separate OpenCV distributions can load duplicate native
      # OpenMP runtimes in the SlideBook Python process.
      - opencv-python
      - networkx==3.2.1
      - tifffile==2024.2.12
      - imageio==2.34.0
      - fsspec==2024.2.0
      - openpyxl
      - pyarrow
      - ultralytics
      - sahi
      - jupyter
