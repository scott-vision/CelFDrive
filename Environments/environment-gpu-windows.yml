name: celfdrive-windows
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy
  - scipy
  - pandas
  - matplotlib
  - scikit-image
  - pillow
  - seaborn
  - tqdm
  - pyyaml
  - pytest
  - pip:
      # Install a CUDA-enabled PyTorch build separately when required; see README.
      - torch
      - torchvision
      - torchaudio
      - dill==0.3.8
      - opencv-contrib-python
      - networkx==3.2.1
      - tifffile==2024.2.12
      - imageio==2.34.0
      - fsspec==2024.2.0
      - openpyxl
      - ultralytics
      - jupyter
