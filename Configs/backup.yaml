schema_version: 1
project:
  repo_path: .
model:
  weights_path: Models/yolo11x_p99p99_bg05/weights/best.pt
  backend: ultralytics_yolo
  suppress_stdout: true
logging:
  enabled: true
  timing:
    enabled: true
  root_dir: ${project.repo_path}/Logging
  use_date_subfolder: true
  date_format: '%Y-%m-%d'
  experiment_folder:
    prefix: exp
    digits: 3
  output_image:
    prefix: tmpimg
    digits: 3
    extension: .png
preprocessing:
  input_channel:
    mode: first_channel_if_rgb
  top_clip_percentile: 0.01
  normalize_min_max: true
inference:
  mode: standard
  sahi:
    confidence_threshold: 0.5
    slice_size_px: 640
    overlap_ratio: 0.25
    tile_batch_size: 6
    merge_iou_threshold: 0.1
tiling:
  enabled: true
  tile_size_px: 640
  edge_mode: shift_last_tile_inside_image
  overlap_px: 0
  deduplication_tolerance_px: 1.0
plotting:
  enabled: true
  cmap: gray
  bbox:
    edge_color: red
    line_width: 1.0
  label:
    font_size: 8
    text_color: white
    background_color: black
    background_alpha: 0.5
coordinate_conversion:
  mode: stage
  default_z_offset_um: 0.0
  merge_tolerance_um: 20.0
  stage_direction:
    x: 1
    y: 1
    z: 1
  llsm:
    invert_y_stage_direction: true
slidebook:
  python_environment: celfdrive-windows
  objective_before_target_search: ''
  highres_objective: 20x Air
  objective_offset_um:
    x: 0.0
    y: 0.0
    z: 0.0
no_detection:
  mode: empty_3i_capture_script
  empty_3i_capture_script: donothing
profile:
  description: High-resolution capture profile
  highres_script: floifmHighres
  highres_comment: Highres
  name_template: '{class_name} Highres x {x}, Y {y}, Z {z}'
  classes:
    0:
      name: prophase
      confidence_threshold: 0.01
      priority_rank: 1
    1:
      name: earlyprometaphase
      confidence_threshold: 0.01
      priority_rank: 0
    2:
      name: prometaphase
      confidence_threshold: 0.01
      priority_rank: 2
    3:
      name: metaphase
      confidence_threshold: 0.01
      priority_rank: 3
    4:
      name: anaphase
      confidence_threshold: 0.01
      priority_rank: 4
    5:
      name: telophase
      confidence_threshold: 0.05
      priority_rank: 5
